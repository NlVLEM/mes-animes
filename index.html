<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes Animes</title>
<meta name="description" content="Ma liste d'animes : vus, en cours, à regarder, et où les trouver.">
<meta name="theme-color" content="#F6F4FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16131F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Animes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Idea: the shelf of key-art posters is the page; the one loud element is the episode strip you tap on shows you're watching. */
:root{
  --bg:#F6F4FA; --surface:#FFFFFF; --surface-2:#EEEBF5; --line:#DDD8E8;
  --ink:#1E1A2E; --ink-2:#585270; --ink-3:#8C86A3;
  --accent:#D3245F; --accent-ink:#FFFFFF; --accent-soft:#FBE3EC;
  --avail:#14806F; --avail-soft:#DDF3EE; --warn:#B8501B;
  --pip-off:#E4E0EE; --pip-future:#C9C3D8;
  --display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --lift:0 1px 2px rgba(30,26,46,.07),0 8px 24px rgba(30,26,46,.10);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16131F; --surface:#201C2C; --surface-2:#2A2539; --line:#363047;
  --ink:#EFECF7; --ink-2:#B3ADC8; --ink-3:#7D7794;
  --accent:#FF5C8F; --accent-ink:#16131F; --accent-soft:#3D2232;
  --avail:#4CC9B0; --avail-soft:#1C3631; --warn:#FF9A5C;
  --pip-off:#332D44; --pip-future:#4A435E;
  --lift:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:1180px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:821px){.wrap{padding-bottom:60px}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);flex:none;position:relative}
.mark::after{content:"";position:absolute;left:13px;top:10px;border-left:11px solid var(--accent-ink);border-top:7px solid transparent;border-bottom:7px solid transparent}
.brand h1{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;margin:0;letter-spacing:.01em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:14px;color:var(--ink-2)}
.iconbtn svg{width:18px;height:18px}
.summary{margin:14px 0 0;color:var(--ink-2);font-size:14px}
.summary b{color:var(--ink);font-weight:700}
.syncline{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.syncline.ok{color:var(--avail)} .syncline.bad{color:var(--warn)}

/* navigation: top pills on wide screens, bottom bar on phones */
.nav{display:flex;gap:4px;margin:20px 0 18px}
.nav button{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:700;font-size:15px;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center}
.nav button .c{font-weight:500;font-size:13px;color:var(--ink-3)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.nav button[aria-current="page"] .c{color:inherit;opacity:.7}
.nav svg{width:20px;height:20px;display:none}
@media (max-width:820px){
  .nav{position:fixed;z-index:20;left:0;right:0;bottom:0;margin:0;gap:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .nav button{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:700;border-radius:12px}
  .nav button .c{display:none}
  .nav svg{display:block}
  .nav button[aria-current="page"]{background:transparent;color:var(--accent)}
}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.search{flex:1 1 240px;position:relative}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 14px 10px 38px;font-size:16px}
select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 12px;font-size:14px;color:var(--ink-2)}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;color:var(--ink-2);font-weight:500}
@media (max-width:520px){.search{flex-basis:100%}.tools select,.tools .toggle{flex:1 1 0;min-width:0}}
.toggle[aria-pressed="true"]{background:var(--avail-soft);border-color:var(--avail);color:var(--ink)}

/* poster shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
@media (max-width:520px){.shelf{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}}
.poster{all:unset;cursor:pointer;display:grid;gap:8px;align-content:start;min-width:0;position:relative}
.poster:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:var(--r-md)}
.cover{aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;background:var(--surface-2);position:relative;box-shadow:var(--lift)}
.cover img{width:100%;height:100%;object-fit:cover}
.poster .t{font-weight:700;font-size:14.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster .s{font-size:12.5px;color:var(--ink-3);margin-top:-4px}
.flag{position:absolute;left:8px;top:8px;background:var(--surface);color:var(--ink);font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.score{position:absolute;right:8px;bottom:8px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.cnt{position:absolute;left:8px;bottom:8px;background:rgba(20,16,30,.82);color:#fff;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.poster .cover:has(.score) .cnt{max-width:calc(100% - 70px)}
.add{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.add svg{width:18px;height:18px}
.plats{display:flex;gap:4px;flex-wrap:wrap}
.pl{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;color:#fff;background:var(--pc,#777);white-space:nowrap}
.pl.dim{background:transparent;color:var(--ink-3);border:1px solid var(--line)}

/* watching rows with episode strip */
.rows{display:grid;gap:14px}
.row{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;background:var(--surface);border-radius:var(--r-lg);padding:12px;border:1px solid var(--line)}
.row .cover{box-shadow:none;border-radius:var(--r-sm);cursor:pointer}
.row .hd{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.row h3{all:unset;font-weight:700;font-size:16px;line-height:1.3;cursor:pointer;display:block}
.row .s{font-size:13px;color:var(--ink-3);margin-top:2px}
.next{font-size:13px;color:var(--avail);font-weight:500;margin-top:2px}
.prog{display:flex;align-items:center;gap:10px;margin-top:10px}
.count{font-size:13px;color:var(--ink-2);white-space:nowrap}
.count b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink)}
.plus{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap;flex:none}
.plus:disabled{opacity:.4;cursor:default}
.strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.pip{width:22px;height:22px;border-radius:6px;border:0;background:var(--pip-off);font-size:10px;font-weight:700;color:var(--ink-3);padding:0;display:grid;place-items:center}
.pip.on{background:var(--accent);color:var(--accent-ink)}
.pip.future{background:transparent;border:1.5px dashed var(--pip-future);cursor:default}
.bar{height:10px;border-radius:999px;background:var(--pip-off);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.finish{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;font-weight:500}
@media (max-width:520px){.row{grid-template-columns:64px minmax(0,1fr);gap:12px}.pip{width:20px;height:20px}}

h2.sec{font-family:var(--display);font-weight:400;font-size:20px;margin:30px 0 14px;line-height:1.2}
h2.sec:first-child{margin-top:4px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-lg);padding:28px 22px;text-align:center;color:var(--ink-2);max-width:560px;margin:10px auto}
.empty h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 6px;color:var(--ink)}
.empty p{margin:0 0 14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 12px;font-size:13px}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.msg{color:var(--ink-2);font-size:14px;padding:20px 0}
.msg.bad{color:var(--warn)}
.more{display:flex;justify-content:center;margin-top:22px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(14,11,22,.5);z-index:40}
.sheet{position:fixed;z-index:41;background:var(--bg);overflow:auto;overscroll-behavior:contain;
  right:0;top:0;bottom:0;width:min(460px,100%);box-shadow:var(--lift);animation:slideIn .22s ease-out}
@keyframes slideIn{from{transform:translateX(30px);opacity:.4}}
@media (max-width:620px){.sheet{left:0;right:0;top:auto;bottom:0;width:auto;max-height:92vh;border-radius:20px 20px 0 0;animation:slideUp .24s ease-out}
  @keyframes slideUp{from{transform:translateY(40px);opacity:.4}}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-close{position:sticky;top:10px;float:right;margin:10px 10px -48px 0;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(8px);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.sh-close svg{width:18px;height:18px}
.sh-hero{position:relative;height:150px;background:var(--surface-2) center/cover no-repeat}
.sh-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--bg))}
.sh-head{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;padding:0 18px;margin-top:-70px;position:relative;z-index:1}
.sh-head .cover{border-radius:var(--r-sm)}
.sh-head h2{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.2;margin:74px 0 2px;overflow-wrap:anywhere}
.sh-head .alt{font-size:13px;color:var(--ink-3)}
.sh-body{padding:16px 18px 30px;display:grid;gap:20px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--ink-2)}
.block h3{font-size:15px;font-weight:700;margin:0 0 8px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 4px;font-size:13px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:700}
.stepper input{width:70px;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px;font-size:16px}
.stars{display:flex;gap:3px;flex-wrap:wrap}
.stars button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:700;color:var(--ink-2);padding:0}
.stars button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea{width:100%;min-height:72px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-size:15px;resize:vertical}
.fam{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.fam-row{display:flex;align-items:center;gap:6px;border-radius:10px;padding-right:6px}
.fam-row.cur{background:var(--accent-soft)}
.fam-open{all:unset;cursor:pointer;flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px}
.fam-open:focus-visible{outline:2px solid var(--accent)}
.thumb{width:36px;height:52px;border-radius:6px;overflow:hidden;flex:none;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.ft{display:block;font-weight:700;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs{display:block;font-size:12.5px;color:var(--ink-3)}
.fa{display:flex;gap:4px;flex:none}
.mini{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--ink-2)}
.mini svg{width:16px;height:16px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.st-done{background:var(--avail-soft);color:var(--avail)}
.tag.st-watching{background:var(--accent-soft);color:var(--accent)}
.where{display:grid;gap:8px}
.where a.svc{display:flex;align-items:center;gap:10px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700}
.where a.svc .dot{width:12px;height:12px;border-radius:50%;background:var(--pc,#777);flex:none}
.where a.svc .mine{margin-left:auto;font-size:12px;font-weight:700;color:var(--avail);background:var(--avail-soft);padding:2px 8px;border-radius:999px}
.where a.svc .lang{font-weight:500;font-size:12.5px;color:var(--ink-3)}
.note{font-size:13px;color:var(--ink-3);margin:0}
.syn{font-size:14px;color:var(--ink-2);margin:0;white-space:pre-line}
.links{display:flex;flex-wrap:wrap;gap:8px}

/* settings */
.form{display:grid;gap:10px}
.form label{font-size:13px;font-weight:700;color:var(--ink-2)}
.form input[type=text],.form input[type=password]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.chk label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chk input{accent-color:var(--accent)}
.warn-t{color:var(--warn)}

.toast{width:max-content;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--lift)}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0}
@media (min-width:821px){.toast{bottom:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Mes Animes</h1></div>
    <button class="iconbtn" id="openSettings" type="button" aria-label="Réglages et synchronisation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>Réglages</span>
    </button>
  </header>
  <p class="summary" id="summary"></p>
  <div class="syncline" id="syncline"></div>

  <nav class="nav" id="nav" aria-label="Sections">
    <button type="button" data-tab="watching"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 4 20 12 6 20 6 4"/></svg>En cours <span class="c" data-c="watching"></span></button>
    <button type="button" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>À regarder <span class="c" data-c="plan"></span></button>
    <button type="button" data-tab="done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>Vus <span class="c" data-c="done"></span></button>
    <button type="button" data-tab="discover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Découvrir</button>
  </nav>

  <main id="main"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" hidden></aside>
<div class="toast" id="toast" role="status" hidden></div>

<script>
'use strict';
/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
};
const DAY = 864e5;
const ICON = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'
};

/* ---------- vocabulary ---------- */
const STATUS = {watching:'En cours', plan:'À regarder', done:'Vu', dropped:'Abandonné'};
const FORMAT = {TV:'Série', TV_SHORT:'Série courte', MOVIE:'Film', SPECIAL:'Spécial', OVA:'OVA', ONA:'ONA', MUSIC:'Clip'};
const AIR = {FINISHED:'Terminé', RELEASING:'En diffusion', NOT_YET_RELEASED:'Pas encore sorti', CANCELLED:'Annulé', HIATUS:'En pause'};
const SEASON_FR = {WINTER:'hiver', SPRING:'printemps', SUMMER:'été', FALL:'automne'};
const GENRE = {Action:'Action', Adventure:'Aventure', Comedy:'Comédie', Drama:'Drame', Ecchi:'Ecchi', Fantasy:'Fantasy', Horror:'Horreur', 'Mahou Shoujo':'Magical girl', Mecha:'Mecha', Music:'Musique', Mystery:'Mystère', Psychological:'Psychologique', Romance:'Romance', 'Sci-Fi':'Science-fiction', 'Slice of Life':'Tranche de vie', Sports:'Sport', Supernatural:'Surnaturel', Thriller:'Thriller'};
// streaming services: how AniList names them, their colour, and a search page for when there is no direct link
const SERVICES = [
  {key:'crunchyroll', name:'Crunchyroll', re:/crunchyroll/i, color:'#F47521', search:q=>`https://www.crunchyroll.com/fr/search?q=${encodeURIComponent(q)}`},
  {key:'netflix', name:'Netflix', re:/netflix/i, color:'#E50914', search:q=>`https://www.netflix.com/search?q=${encodeURIComponent(q)}`},
  {key:'adn', name:'ADN', re:/^adn$|animation digital network/i, color:'#0A8FD6', search:null},
  {key:'prime', name:'Prime Video', re:/amazon|prime video/i, color:'#1A98FF', search:q=>`https://www.primevideo.com/search/ref=atv_nb_sr?phrase=${encodeURIComponent(q)}`},
  {key:'disney', name:'Disney+', re:/disney/i, color:'#113CCF', search:null},
  {key:'hidive', name:'HIDIVE', re:/hidive/i, color:'#00AEEF', search:null},
];
const svcOf = site => SERVICES.find(s => s.re.test(site||''));

/* ---------- stored state ---------- */
const K = {entries:'animes-entries', prefs:'animes-prefs', prefsAt:'animes-prefs-at', sync:'animes-sync', deleted:'animes-deleted'};
let entries = new Map(Object.entries(LS.get(K.entries, {})));
let prefs = Object.assign({platforms:['crunchyroll','netflix']}, LS.get(K.prefs, {}));
let prefsAt = LS.get(K.prefsAt, 0);
const ui = Object.assign({tab:'watching', sort:'recent', mine:false}, LS.get('animes-ui', {}));
let q = '';
function saveUi(){ LS.set('animes-ui', {tab:ui.tab, sort:ui.sort, mine:ui.mine}); }
function saveEntries(){ LS.set(K.entries, Object.fromEntries(entries)); stampChanges(); }
function savePrefs(){ prefsAt = Date.now(); LS.set(K.prefs, prefs); LS.set(K.prefsAt, prefsAt); scheduleSync(); }

/* ---------- AniList ---------- */
const media = new Map();   // id -> compact media, from searches and from the list
for (const e of entries.values()) if (e.m) media.set(e.m.id, e.m);
const FRAG = `fragment M on Media { id title{romaji english native} coverImage{extraLarge large color} bannerImage format status episodes duration season seasonYear startDate{year month day} genres averageScore description(asHtml:false) siteUrl nextAiringEpisode{episode airingAt} externalLinks{site url type language} studios(isMain:true){nodes{name}} relations{edges{relationType node{id type}}} }`;
class ApiError extends Error {}
// relations that keep you inside the same story: seasons, movies, specials, recaps, remakes
const WALK = new Set(['PREQUEL','SEQUEL','PARENT','SIDE_STORY','SUMMARY','ALTERNATIVE']);
async function anilist(query, variables){
  let r;
  try{ r = await fetch('https://graphql.anilist.co', {method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify({query:query+'\n'+FRAG, variables})}); }
  catch(e){ throw new ApiError(navigator.onLine===false ? 'Pas de connexion : la recherche reviendra avec le réseau.' : 'AniList ne répond pas, réessaie dans un instant.'); }
  if (r.status===429) throw new ApiError('AniList limite le nombre de recherches : attends une minute et réessaie.');
  const j = await r.json().catch(()=>null);
  if (!r.ok || !j || j.errors) throw new ApiError('AniList a renvoyé une erreur, réessaie dans un instant.');
  return j.data;
}
const clean = s => String(s||'').replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/\n{3,}/g,'\n\n').replace(/&quot;/g,'"').replace(/&amp;/g,'&').replace(/&#039;/g,"'").trim();
function compact(x){
  const m = {
    id:x.id, t:x.title.english||x.title.romaji, r:x.title.romaji, n:x.title.native,
    img:x.coverImage&&(x.coverImage.extraLarge||x.coverImage.large), col:x.coverImage&&x.coverImage.color, ban:x.bannerImage,
    f:x.format, s:x.status, eps:x.episodes, dur:x.duration, yr:x.seasonYear||(x.startDate&&x.startDate.year), se:x.season,
    g:x.genres||[], sc:x.averageScore, d:clean(x.description).slice(0,1600), url:x.siteUrl,
    studio:x.studios&&x.studios.nodes&&x.studios.nodes[0]&&x.studios.nodes[0].name,
    links:(x.externalLinks||[]).filter(l=>l.type==='STREAMING').map(l=>({site:l.site, url:l.url, lang:l.language||''})),
    nx:x.nextAiringEpisode?{ep:x.nextAiringEpisode.episode, at:x.nextAiringEpisode.airingAt*1000}:null,
    sd:x.startDate&&x.startDate.year ? x.startDate.year*10000+(x.startDate.month||12)*100+(x.startDate.day||28) : 99999999,
    rel:((x.relations&&x.relations.edges)||[]).filter(r=>r.node&&r.node.type==='ANIME'&&WALK.has(r.relationType)).map(r=>({id:r.node.id, k:r.relationType})),
    fetched:Date.now()
  };
  media.set(m.id, m);
  const e = entries.get(String(m.id)); if (e) e.m = m;
  return m;
}
/* other seasons of a show are kept in a light cache (no synopsis) so the list can group them */
let mcache = LS.get('animes-media', {});
for (const m of Object.values(mcache)) if (!media.has(m.id)) media.set(m.id, m);
function saveMediaCache(ids){
  for (const id of ids){ const m = media.get(id); if (m){ const {d, ...lite} = m; mcache[id] = {...lite, lite:true}; } }
  const keys = Object.keys(mcache); if (keys.length > 1500) keys.sort((a,b)=>(mcache[a].fetched||0)-(mcache[b].fetched||0)).slice(0, keys.length-1500).forEach(k => delete mcache[k]);
  LS.set('animes-media', mcache);
}
let frs = LS.get('animes-franchises', {});   // first id of a show -> every season, film and special of it
let idRoot = new Map();
function buildIdx(){ idRoot = new Map(); for (const [r,f] of Object.entries(frs)) for (const id of f.ids) idRoot.set(+id, +r); }
buildIdx();
function frOf(id){ id = +id; if (idRoot.has(id)) return idRoot.get(id); const e = entries.get(String(id)); return e && e.fr ? +e.fr : id; }
function familyOf(id){ const r = idRoot.get(+id); return r!=null && frs[r] ? frs[r].ids.map(i => media.get(i)).filter(Boolean).sort((a,b)=>a.sd-b.sd) : null; }
const frLoading = new Map();
function loadFranchise(id){
  id = +id;
  const r = idRoot.get(id);
  if (r!=null && frs[r] && Date.now()-frs[r].at < 14*DAY) return Promise.resolve(r);
  if (frLoading.has(id)) return frLoading.get(id);
  const p = (async () => {
    const seen = new Set([id]); let frontier = [id]; const members = [];
    for (let round=0; round<8 && frontier.length && seen.size<=60; round++){
      const need = frontier.filter(i => { const m = media.get(i); return !(m && m.rel && Date.now()-(m.fetched||0) < 14*DAY); });
      if (need.length){
        const d = await anilist(`query($ids:[Int],$p:Int,$n:Int){ ${PAGE.replace('%ARGS%','id_in:$ids')} }`, {ids:need, p:1, n:50});
        d.Page.media.forEach(compact);
      }
      const next = [];
      for (const i of frontier){ const m = media.get(i); if (!m) continue; members.push(m); for (const x of m.rel||[]) if (!seen.has(x.id)){ seen.add(x.id); next.push(x.id); } }
      frontier = next.slice(0, 50);
    }
    const keep = members.filter(m => m.f!=='MUSIC').sort((a,b)=>a.sd-b.sd);
    if (!keep.length) return id;
    const root = keep[0].id, ids = keep.map(m => m.id);
    for (const k of Object.keys(frs)) if (frs[k].ids.some(i => ids.includes(i))) delete frs[k];
    frs[root] = {ids, at:Date.now()}; LS.set('animes-franchises', frs); buildIdx(); saveMediaCache(ids);
    let ch = false; for (const i of ids){ const e = entries.get(String(i)); if (e && e.fr!==root){ e.fr = root; ch = true; } }
    if (ch) LS.set(K.entries, Object.fromEntries(entries));
    return root;
  })().catch(() => null).finally(() => frLoading.delete(id));
  frLoading.set(id, p); return p;
}
// group the list little by little in the background, gently for AniList
let frQueueOn = false;
async function franchiseQueue(){
  if (frQueueOn) return; frQueueOn = true;
  try{
    for (;;){
      const e = [...entries.values()].find(e => { const r = idRoot.get(+e.id); return r==null || !frs[r] || Date.now()-frs[r].at > 14*DAY; });
      if (!e || navigator.onLine===false) break;
      const r = await loadFranchise(e.id); if (r==null) break;
      render(); if (sheetId!=null) renderSheet();
      await new Promise(ok => setTimeout(ok, 2500));
    }
  } finally { frQueueOn = false; }
}
function countLabel(ms){
  const tv = ms.filter(m => !['MOVIE','SPECIAL','OVA','MUSIC'].includes(m.f)).length, films = ms.filter(m => m.f==='MOVIE').length, other = ms.length - tv - films;
  return [tv && `${tv} saison${tv>1?'s':''}`, films && `${films} film${films>1?'s':''}`, other && `${other} spécia${other>1?'ux':'l'}`].filter(Boolean).join(', ');
}
const PAGE = `Page(page:$p, perPage:$n){ pageInfo{hasNextPage} media(%ARGS%, type:ANIME, isAdult:false){...M} }`;
async function searchAnime(text, page=1){
  const d = await anilist(`query($q:String,$p:Int,$n:Int){ ${PAGE.replace('%ARGS%','search:$q, sort:[SEARCH_MATCH, POPULARITY_DESC]')} }`, {q:text, p:page, n:24});
  return {list:d.Page.media.map(compact), more:d.Page.pageInfo.hasNextPage};
}
function currentSeason(){ const d=new Date(), m=d.getMonth(); return {season:['WINTER','WINTER','WINTER','SPRING','SPRING','SPRING','SUMMER','SUMMER','SUMMER','FALL','FALL','FALL'][m], year:d.getFullYear()}; }
async function seasonAnime(page=1){
  const {season, year} = currentSeason();
  const d = await anilist(`query($s:MediaSeason,$y:Int,$p:Int,$n:Int){ ${PAGE.replace('%ARGS%','season:$s, seasonYear:$y, sort:[POPULARITY_DESC]')} }`, {s:season, y:year, p:page, n:24});
  return {list:d.Page.media.map(compact), more:d.Page.pageInfo.hasNextPage};
}
async function trendingAnime(){
  const d = await anilist(`query($p:Int,$n:Int){ ${PAGE.replace('%ARGS%','sort:[TRENDING_DESC]')} }`, {p:1, n:18});
  return {list:d.Page.media.map(compact), more:false};
}
async function fetchOne(id){
  const d = await anilist(`query($id:Int){ Media(id:$id, type:ANIME){...M} }`, {id});
  return compact(d.Media);
}
// keep episode counts and airing dates of the list fresh (airing shows twice a day, the rest weekly)
async function refreshList(){
  const now = Date.now();
  const stale = [...entries.values()].filter(e => !e.m || now-(e.m.fetched||0) > ((e.m.s==='RELEASING'||e.m.s==='NOT_YET_RELEASED') ? DAY/2 : 7*DAY)).map(e => +e.id);
  for (let i=0; i<stale.length; i+=50){
    try{
      const d = await anilist(`query($ids:[Int],$p:Int,$n:Int){ ${PAGE.replace('%ARGS%','id_in:$ids')} }`, {ids:stale.slice(i,i+50), p:1, n:50});
      d.Page.media.forEach(compact);
    }catch(e){ return; }
  }
  if (stale.length){ LS.set(K.entries, Object.fromEntries(entries)); render(); }
}

/* ---------- list operations ---------- */
function setEntry(m, patch){
  const id = String(m.id), prev = entries.get(id);
  const e = Object.assign({id, st:'plan', ep:0, score:0, note:'', added:Date.now()}, prev, patch, {m});
  if (e.st==='done' && m.eps) e.ep = m.eps;
  if (!prev && e.st==='watching' && !e.started) e.started = Date.now();
  if (e.st==='done' && (!prev || prev.st!=='done')) e.finished = Date.now();
  entries.set(id, e); saveEntries(); render();
  if (!prev) loadFranchise(m.id).then(() => { render(); if (sheetId!=null) renderSheet(); });
  return e;
}
function removeEntry(id){
  const e = entries.get(String(id)); if (!e) return;
  entries.delete(String(id)); saveEntries(); render();
  toast(`${e.m ? e.m.t : 'Anime'} retiré de ta liste`, 'Annuler', () => { entries.set(String(id), e); saveEntries(); render(); });
}
// last episode out so far: known total, or the one before the next airing
function airedOf(m){ if (!m) return null; if (m.nx) return Math.max(0, m.nx.ep-1); if (m.s==='NOT_YET_RELEASED') return 0; return m.eps || null; }
function stepEp(id, to){
  const e = entries.get(String(id)); if (!e) return;
  const aired = airedOf(e.m), total = e.m && e.m.eps;
  let ep = Math.max(0, to); if (total) ep = Math.min(ep, total);
  e.ep = ep; if (e.st==='plan' && ep>0) e.st = 'watching';
  entries.set(String(id), e); saveEntries(); render();
}

/* ---------- streaming availability ---------- */
function services(m){
  const out = new Map();
  for (const l of (m && m.links) || []){
    const s = svcOf(l.site); const key = s ? s.key : 'x:'+l.site;
    const prev = out.get(key);
    if (!prev) out.set(key, {key, name:s?s.name:l.site, color:s?s.color:'#777', url:l.url, langs:l.lang?[l.lang]:[], known:!!s});
    else if (l.lang && !prev.langs.includes(l.lang)) prev.langs.push(l.lang);
  }
  return [...out.values()];
}
const onMine = m => services(m).some(s => prefs.platforms.includes(s.key));
function platBadges(m){
  const mine = services(m).filter(s => prefs.platforms.includes(s.key));
  if (!mine.length) return '';
  return `<div class="plats">${mine.map(s=>`<span class="pl" style="--pc:${s.color}">${esc(s.name)}</span>`).join('')}</div>`;
}

/* ---------- rendering ---------- */
function subline(m){
  const bits = [];
  if (m.f) bits.push(FORMAT[m.f]||m.f);
  if (m.yr) bits.push(m.yr);
  if (m.f==='MOVIE'){ if (m.dur) bits.push(`${m.dur} min`); }
  else if (m.eps) bits.push(`${m.eps} ép.`);
  else if (m.s==='RELEASING') bits.push('en diffusion');
  return bits.join(', ');
}
function coverImg(m, eager){ return m.img ? `<img src="${esc(m.img)}" alt="" loading="${eager?'eager':'lazy'}" decoding="async">` : ''; }
function posterCard(m, opts={}){
  const e = entries.get(String(m.id));
  const flag = opts.discover && e ? `<span class="flag">${esc(STATUS[e.st])}</span>` : '';
  const score = !opts.discover && e && e.score ? `<span class="score num">${e.score}/10</span>` : '';
  const cnt = opts.group && opts.group.length>1 ? `<span class="cnt">${esc(countLabel(opts.group))}</span>` : '';
  const add = opts.discover && !e ? `<button class="add" type="button" data-add="${m.id}" aria-label="Ajouter ${esc(m.t)} à regarder">${ICON.plus}</button>` : '';
  return `<div class="poster-wrap" style="position:relative">
    <button class="poster" type="button" data-open="${m.id}">
      <div class="cover" style="background-color:${esc(m.col||'')}">${coverImg(m)}${flag}${score}${cnt}</div>
      <span class="t">${esc(opts.title||m.t)}</span><span class="s">${esc(opts.sub||subline(m))}</span>${platBadges(m)}
    </button>${add}</div>`;
}
function nextLine(m){
  if (!m || !m.nx) return '';
  const d = new Date(m.nx.at), now = Date.now(), diff = m.nx.at - now;
  const day = diff < DAY && d.getDate()===new Date().getDate() ? "aujourd’hui" : diff < 2*DAY && d.getDate()===new Date(now+DAY).getDate() ? 'demain' : d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month: diff>6*DAY?'long':undefined});
  return `<div class="next">Épisode ${m.nx.ep} ${day} à ${d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</div>`;
}
function watchRow(e){
  const m = e.m || {id:e.id, t:'…'};
  const total = m.eps, aired = airedOf(m);
  const cap = total || aired;            // episodes you could have watched
  const drawn = total || (aired ? aired + (m.nx?1:0) : Math.max(e.ep+1, 12));
  let track;
  if (drawn <= 52){
    let pips = '';
    for (let i=1; i<=drawn; i++){
      const future = aired!=null && i>aired;
      pips += `<button class="pip${i<=e.ep?' on':''}${future?' future':''}" type="button" data-ep="${e.id}:${i}" ${future?'disabled':''} aria-label="Épisode ${i}${future?' (pas encore sorti)':''}" aria-pressed="${i<=e.ep}">${i}</button>`;
    }
    track = `<div class="strip" role="group" aria-label="Épisodes vus">${pips}</div>`;
  } else {
    track = `<div class="bar" aria-hidden="true"><i style="width:${Math.min(100, e.ep/(cap||e.ep||1)*100)}%"></i></div>`;
  }
  const behind = aired!=null && e.ep < aired ? aired - e.ep : 0;
  const finished = total && e.ep >= total;
  return `<article class="row">
    <div class="cover" data-open="${m.id}" style="background-color:${esc(m.col||'')}">${coverImg(m)}</div>
    <div style="min-width:0">
      <div class="hd"><div style="min-width:0"><h3 data-open="${m.id}" tabindex="0" role="button">${esc(m.t)}</h3>
        <div class="s">${esc(subline(m))}${behind>1?`, ${behind} épisodes de retard`:''}</div>${nextLine(m)}</div></div>
      <div class="prog">
        <span class="count num"><b>${e.ep}</b> / ${total||'?'}</span>
        <button class="plus" type="button" data-step="${e.id}" ${finished || (aired!=null && e.ep>=aired) ? 'disabled':''}>+1 épisode</button>
      </div>
      ${track}
      ${finished ? `<div class="finish">Série terminée. <button class="btn small primary" type="button" data-done="${e.id}">${ICON.check} Ranger dans Vus</button></div>` : ''}
    </div></article>`;
}
function sorted(list){
  const by = {
    recent:(a,b)=>(b.updated||b.added||0)-(a.updated||a.added||0),
    title:(a,b)=>(a.m&&a.m.t||'').localeCompare(b.m&&b.m.t||'', 'fr'),
    score:(a,b)=>(b.score||0)-(a.score||0) || ((b.m&&b.m.sc||0)-(a.m&&a.m.sc||0)),
    next:(a,b)=>((a.m&&a.m.nx&&a.m.nx.at)||9e15)-((b.m&&b.m.nx&&b.m.nx.at)||9e15)
  }[ui.sort] || ((a,b)=>0);
  return list.sort(by);
}
function filtered(st){
  const needle = q.trim().toLowerCase();
  return [...entries.values()].filter(e => (st==='done' ? (e.st==='done'||e.st==='dropped') : e.st===st)
    && (!ui.mine || onMine(e.m))
    && (!needle || [e.m&&e.m.t, e.m&&e.m.r, e.m&&e.m.n, e.note].some(s => String(s||'').toLowerCase().includes(needle))));
}
// group list entries of the same show, keeping the list order; the card shows the earliest season
function groupedShelf(list, tab){
  const g = new Map();
  for (const e of list){ const k = frOf(e.id); if (!g.has(k)) g.set(k, []); g.get(k).push(e); }
  return `<div class="shelf">${[...g.values()].map(es => {
    const ms = es.map(e => e.m || {id:+e.id, t:'…', sd:0}).sort((a,b)=>(a.sd||0)-(b.sd||0));
    const fam = familyOf(ms[0].id), head = fam ? fam[0] : null;
    const scored = es.filter(e => e.score), avg = scored.length ? Math.round(scored.reduce((s,e)=>s+e.score,0)/scored.length) : 0;
    const shown = ms[0];
    const left = tab==='done' && fam ? fam.filter(x => { const e = entries.get(String(x.id)); return !e || (e.st!=='done' && e.st!=='dropped'); }) : [];
    const html = posterCard(shown, {group:ms, title: ms.length>1 && head ? head.t : shown.t, sub: left.length ? `Encore ${countLabel(left)} à voir` : ''});
    return ms.length>1 && avg ? html.replace(/<span class="score num">[^<]*<\/span>/, `<span class="score num">${avg}/10</span>`) : html;
  }).join('')}</div>`;
}
function toolsBar(placeholder, sorts){
  return `<div class="tools">
    <label class="search">${ICON.search}<input type="search" id="q" placeholder="${esc(placeholder)}" value="${esc(q)}" autocomplete="off" enterkeyhint="search" aria-label="${esc(placeholder)}"></label>
    ${sorts ? `<select id="sort" aria-label="Trier">${sorts.map(([v,l])=>`<option value="${v}"${ui.sort===v?' selected':''}>${l}</option>`).join('')}</select>` : ''}
    <button class="toggle" type="button" id="mine" aria-pressed="${ui.mine}">Mes plateformes</button>
  </div>`;
}
function summary(){
  const all = [...entries.values()];
  const n = st => all.filter(e => e.st===st).length;
  const eps = all.reduce((s,e)=>s+(e.ep||0), 0);
  const mins = all.reduce((s,e)=>s+(e.ep||0)*((e.m&&e.m.dur)||24), 0);
  document.querySelectorAll('[data-c]').forEach(el => { const c = el.dataset.c==='done' ? n('done')+n('dropped') : n(el.dataset.c); el.textContent = c||''; });
  $('#summary').innerHTML = all.length

/* discover: season + trending when the box is empty, AniList search otherwise */
function discShelf(list){
  const ids = new Set(list.map(m => m.id)), up = new Map(list.map(m => [m.id, m.id]));
  const find = i => { while (up.get(i)!==i){ up.set(i, up.get(up.get(i))); i = up.get(i); } return i; };
  for (const m of list){
    for (const r of m.rel||[]) if (ids.has(r.id)) up.set(find(m.id), find(r.id));
    const k = idRoot.get(m.id); if (k!=null) for (const o of list) if (o!==m && idRoot.get(o.id)===k) up.set(find(m.id), find(o.id));
  }
  const g = new Map(); for (const m of list){ const k = find(m.id); if (!g.has(k)) g.set(k, []); g.get(k).push(m); }
  return `<div class="shelf">${[...g.values()].map(ms => { ms.sort((a,b)=>a.sd-b.sd); return posterCard(ms[0], {discover:true, group:ms}); }).join('')}</div>`;
}

/* ---------- GitHub sync (same scheme as the Pokémon binder: one JSON file in a private repo, merged entry by entry) ---------- */
const GH = 'https://api.github.com', SYNC_FILE = 'animes.json';
let sync = Object.assign({repo:'', token:'', last:0, err:''}, LS.get(K.sync, {}));
let tomb = LS.get(K.deleted, {});
const strip = e => { const {updated, m, fr, ...r} = e; return JSON.stringify(r); };   // what counts as a change you made
let snap = new Map([...entries].map(([id,e]) => [id, strip(e)]));
function stampChanges(){
  const now = Date.now(); let ch = false;
  for (const [id,e] of entries){ const s = strip(e); if (snap.get(id)!==s){ entries.set(id, {...e, updated:now}); snap.set(id, s); delete tomb[id]; ch = true; } }
  for (const id of [...snap.keys()]) if (!entries.has(id)){ snap.delete(id); tomb[id] = now; ch = true; }
  LS.set(K.entries, Object.fromEntries(entries));
  if (ch){ LS.set(K.deleted, tomb); scheduleSync(); }
}
function syncOn(){ return !!(sync.repo && sync.token); }
function saveSync(){ LS.set(K.sync, {repo:sync.repo, token:sync.token, last:sync.last, err:sync.err}); }
let syncT = null, syncing = null, syncAgain = false;
function scheduleSync(delay){ if (!syncOn()) return; clearTimeout(syncT); syncT = setTimeout(() => runSync(), delay ?? 3000); }
const b64e = s => { const u = new TextEncoder().encode(s); let b=''; for (let i=0;i<u.length;i+=0x8000) b += String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); return btoa(b); };

function gh(path, opt={}){
  return fetch(GH+path, {method:opt.method||'GET', cache:'no-store', body:opt.body,
    headers:{'Authorization':'Bearer '+sync.token, 'Accept':opt.accept||'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28', ...(opt.body?{'Content-Type':'application/json'}:{})}});
}
async function pull(){
  const r = await gh(`/repos/${sync.repo}/contents/${SYNC_FILE}`);
  if (r.status===404) return {sha:null, data:null};
  if (!r.ok) throw r;
  const j = await r.json(); let text;
  if (j.content && j.encoding==='base64') text = b64d(j.content);
  else text = await (await gh(`/repos/${sync.repo}/contents/${SYNC_FILE}`, {accept:'application/vnd.github.raw'})).text();
  return {sha:j.sha, data:JSON.parse(text)};
}
const sortedJSON = o => JSON.stringify(Object.keys(o||{}).sort().map(k => [k, typeof o[k]==='object' ? strip(o[k]) : o[k]]));
function merge(remote){
  const re = remote && remote.entries || {}, rd = remote && remote.deleted || {};
  const ids = new Set([...entries.keys(), ...Object.keys(re), ...Object.keys(tomb), ...Object.keys(rd)]);
  let changed = 0;
  for (const id of ids){
    const l = entries.get(id), r = re[id], lt = l ? (l.updated||0) : -1, rt = r ? (r.updated||0) : -1, del = Math.max(tomb[id]||-1, rd[id]||-1);
    if (del>-1 && del>=Math.max(lt,rt)){ if (l){ entries.delete(id); changed++; } tomb[id] = del; snap.delete(id); }
    else if (rt>lt){
      const keepM = l && l.m && r.m && (l.m.fetched||0) > (r.m.fetched||0) ? l.m : r.m;   // keep whichever show info is fresher
      entries.set(id, {...r, m:keepM}); snap.set(id, strip(r)); delete tomb[id]; if (keepM) media.set(keepM.id, keepM); changed++;
    }
  }
  const old = Date.now()-120*DAY; for (const id of Object.keys(tomb)) if (tomb[id]<old) delete tomb[id];
  if (remote && remote.prefs && (remote.prefsAt||0) > prefsAt){ prefs = Object.assign(prefs, remote.prefs); prefsAt = remote.prefsAt; LS.set(K.prefs, prefs); LS.set(K.prefsAt, prefsAt); changed++; }
  return changed;
}
const payload = () => ({app:'mes-animes', v:1, saved:new Date().toISOString(), entries:Object.fromEntries(entries), deleted:tomb, prefs, prefsAt});
const deviceName = () => /iPhone|iPad|Android/i.test(navigator.userAgent) ? 'téléphone' : 'ordinateur';
async function runSync(){
  if (!syncOn()) return;
  if (syncing){ syncAgain = true; return syncing; }
  syncing = (async () => {
    showSync('Synchronisation…');
    for (let attempt=0; attempt<3; attempt++){
      const {sha, data} = await pull();
      const before = sortedJSON(data&&data.entries) + sortedJSON(data&&data.deleted) + (data&&data.prefsAt||0);
      const n = merge(data);
      if (n){ LS.set(K.entries, Object.fromEntries(entries)); LS.set(K.deleted, tomb); render(); if (sheetId!=null) renderSheet(); }
      const p = payload(), after = sortedJSON(p.entries) + sortedJSON(p.deleted) + (p.prefsAt||0);
      if (after===before){ sync.last = Date.now(); sync.err=''; saveSync(); return n; }
      const r = await gh(`/repos/${sync.repo}/contents/${SYNC_FILE}`, {method:'PUT', body:JSON.stringify({message:`Animes : synchro depuis le ${deviceName()}`, content:b64e(JSON.stringify(p)), ...(sha?{sha}:{})})});
      if (r.ok){ sync.last = Date.now(); sync.err=''; saveSync(); return n; }
      if (r.status!==409 && r.status!==422) throw r;   // another device saved in between: merge again
    }
    throw new Error('conflict');
  })().catch(e => {
    const st = e && e.status;
    sync.err = st===401 ? 'Jeton refusé ou expiré : recrée-le et reconnecte cet appareil.' : st===403||st===404 ? 'Accès refusé au dépôt : vérifie son nom et les droits du jeton (Contents : lecture et écriture).' : navigator.onLine===false ? 'Hors ligne : la synchro reprendra avec la connexion.' : 'La synchro a échoué, nouvel essai plus tard.';
    saveSync();
  }).finally(() => { syncing = null; showSync(); if (sheetId==='settings') renderSettings(); if (syncAgain){ syncAgain=false; scheduleSync(1500); } });
  return syncing;
}
function showSync(busy){
  const el = $('#syncline');
  if (!syncOn()){ el.textContent=''; el.className='syncline'; return; }
  if (busy){ el.textContent = busy; el.className='syncline'; return; }
  if (sync.err){ el.textContent = 'Synchro : '+sync.err; el.className='syncline bad'; return; }
  el.className = 'syncline ok';
  el.textContent = sync.last ? `Synchronisé à ${new Date(sync.last).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}` : 'Synchro activée';
}
async function connectSync(ev){
  ev.preventDefault();
  const repo = $('#syRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,''), token = $('#syToken').value.trim(), err = $('#syErr');
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)){ err.textContent = 'Indique le dépôt sous la forme pseudo/nom, par exemple NlVLEM/classeur-data.'; return; }
  if (!token){ err.textContent = 'Colle le jeton d’accès créé sur GitHub.'; return; }
  err.textContent = 'Vérification…';
  const prev = sync; sync = {repo, token, last:0, err:''};
  try{
    const r = await gh(`/repos/${repo}`);
    if (r.status===401){ sync = prev; err.textContent = 'Jeton refusé : vérifie que tu l’as copié en entier.'; return; }
    if (!r.ok){ sync = prev; err.textContent = 'Dépôt introuvable avec ce jeton : vérifie son nom et que le jeton y a accès.'; return; }
    const j = await r.json();
    if (!j.private){ sync = prev; err.textContent = 'Ce dépôt est public : ta liste serait visible par tout le monde. Utilise un dépôt privé.'; return; }
    if (j.permissions && !j.permissions.push){ sync = prev; err.textContent = 'Le jeton peut lire le dépôt mais pas écrire : donne-lui Contents → Read and write.'; return; }
  }catch(e){ sync = prev; err.textContent = 'Impossible de joindre GitHub : vérifie ta connexion.'; return; }
  saveSync(); await runSync(); render();
  toast(sync.err ? 'Connecté, mais la première synchro a échoué' : 'Synchronisé : ta liste est maintenant la même sur tous tes appareils');
}

/* ---------- backup ---------- */
function exportList(){
  const blob = new Blob([JSON.stringify(payload(), null, 1)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `mes-animes-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importList(file){
  try{
    const data = JSON.parse(await file.text());
    if (!data || data.app!=='mes-animes' || typeof data.entries!=='object') throw 0;
    let n = 0;
    for (const [id, e] of Object.entries(data.entries)){ if (e && e.st && STATUS[e.st]){ entries.set(id, e); if (e.m) media.set(e.m.id, e.m); n++; } }
    saveEntries(); render(); toast(`${n} anime${n>1?'s':''} importé${n>1?'s':''}`);
  }catch(e){ toast('Ce fichier n’est pas une sauvegarde de Mes Animes.'); }
}

/* ---------- toast ---------- */
let toastT = null;
function toast(text, action, fn){
  const t = $('#toast'); clearTimeout(toastT);
  t.innerHTML = `<span>${esc(text)}</span>${action?`<button type="button" id="toastAct">${esc(action)}</button>`:''}`; t.hidden = false;
  if (action) $('#toastAct').onclick = () => { t.hidden = true; fn(); };
  toastT = setTimeout(() => t.hidden = true, action ? 6000 : 3500);
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button,[data-open],a,label'); if (!t) return;
  const d = t.dataset;
  if (d.tab){ ui.tab = d.tab; q=''; saveUi(); render(); window.scrollTo({top:0}); return; }
  if (d.go){ ui.tab = d.go; q=''; saveUi(); render(); const i=$('#q'); i && i.focus(); return; }
  if (d.add){ const m = media.get(+d.add); if (m){ setEntry(m, {st:'plan'}); toast(`${m.t} ajouté à regarder`, 'Annuler', () => { entries.delete(String(m.id)); saveEntries(); render(); }); } return; }
  if (d.open){ openSheet(d.open); return; }
  if (d.close!==undefined){ closeSheet(); return; }
  if (d.ep){ const [id, n] = d.ep.split(':').map(Number); const e = entries.get(String(id)); stepEp(id, e && e.ep===n ? n-1 : n); return; }
  if (d.step){ const e = entries.get(d.step); if (e){ stepEp(e.id, e.ep+1); const ne = entries.get(d.step); if (ne.m && ne.m.eps && ne.ep>=ne.m.eps) toast(`Dernier épisode de ${ne.m.t} !`, 'Ranger dans Vus', () => setEntry(ne.m, {st:'done'})); } return; }
  if (d.done){ const e = entries.get(d.done); if (e && e.m){ setEntry(e.m, {st:'done'}); toast(`${e.m.t} rangé dans Vus. Pense à le noter !`, 'Noter', () => openSheet(e.id)); } return; }
  if (d.addst){ const m = media.get(sheetId); if (m){ setEntry(m, {st:d.addst}); renderSheet(); } return; }
  if (d.st){ const m = media.get(sheetId); if (m){ setEntry(m, {st:d.st}); renderSheet(); } return; }
  if (d.score){ const e = entries.get(String(sheetId)); if (e){ const s = +d.score; setEntry(e.m, {score: e.score===s ? 0 : s}); renderSheet(); } return; }
  if (d.shstep){ const e = entries.get(String(sheetId)); if (e){ stepEp(e.id, e.ep + (+d.shstep)); renderSheet(); } return; }
  if (d.qadd){ const [id, st] = d.qadd.split(':'); const x = media.get(+id); if (x){ setEntry(x, {st}); renderSheet(); } return; }
  if (d.famall){ const fam = familyOf(sheetId) || []; const n = fam.filter(x => !entries.has(String(x.id))); n.forEach(x => setEntry(x, {st:d.famall})); renderSheet(); toast(`${n.length} ajouté${n.length>1?'s':''} ${d.famall==='done'?'dans Vus':'à regarder'}`); return; }
  if (d.remove){ closeSheet(); removeEntry(d.remove); return; }
  if (t.id==='mine'){ ui.mine = !ui.mine; saveUi(); render(); return; }
  if (t.id==='moreRes'){ if (!disc.loading) runSearch(disc.page+1); return; }
  if (t.id==='openSettings'){ openSettings(); return; }
  if (t.id==='syNow'){ runSync(); return; }
  if (t.id==='syOff'){ sync = {repo:sync.repo, token:'', last:0, err:''}; saveSync(); showSync(); renderSettings(); toast('Cet appareil n’est plus synchronisé. Ta liste reste enregistrée ici.'); return; }
  if (t.id==='exp'){ exportList(); return; }
});
document.addEventListener('keydown', ev => {
  if (ev.key==='Escape' && sheetId!=null) closeSheet();
  if ((ev.key==='Enter' || ev.key===' ') && ev.target.matches('h3[data-open]')){ ev.preventDefault(); openSheet(ev.target.dataset.open); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id==='q'){
    q = t.value;
    if (ui.tab==='discover'){ clearTimeout(searchT); if (!q.trim()){ disc.list=[]; disc.err=''; disc.key=null; renderDiscover(); } else searchT = setTimeout(() => runSearch(1), 450); }
    else render();
  }
  if (t.id==='noteIn'){ const e = entries.get(String(sheetId)); if (e){ e.note = t.value; entries.set(e.id, e); clearTimeout(t._t); t._t = setTimeout(() => { saveEntries(); }, 600); } }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id==='sort'){ ui.sort = t.value; saveUi(); render(); }
  if (t.id==='epIn'){ const e = entries.get(String(sheetId)); if (e){ stepEp(e.id, parseInt(t.value,10)||0); renderSheet(); } }
  if (t.dataset.plat){ const k = t.dataset.plat; prefs.platforms = t.checked ? [...new Set([...prefs.platforms, k])] : prefs.platforms.filter(x => x!==k); savePrefs(); render(); }
  if (t.id==='imp' && t.files[0]){ importList(t.files[0]); t.value=''; }
});
document.addEventListener('submit', ev => { if (ev.target.id==='syForm') connectSync(ev); });
$('#scrim').addEventListener('click', closeSheet);
document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible'){ if (syncOn() && Date.now()-sync.last>30000) runSync(); refreshList(); render(); } });
window.addEventListener('online', () => { if (syncOn()) runSync(); });

/* ---------- start ---------- */
render(); showSync();
if (syncOn()) runSync();
refreshList().then(franchiseQueue);
setInterval(() => { if (document.visibilityState==='visible' && ui.tab==='watching') render(); }, 60000);   // keeps "next episode" times current
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
